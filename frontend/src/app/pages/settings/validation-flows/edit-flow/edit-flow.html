@if (loading()) {
  <mat-progress-bar mode="indeterminate"/>
}

<div class="flow-form">
  <div class="field-container">
    <span class="field">{{ flow()?.user?.displayName }}</span>
  </div>
  <div class="field-container">
    <span class="field">{{ flow()?.context?.name }}</span>
  </div>
</div>


<app-validators-manager [title]="'flows.validators.title'|translate" [backendUrl]="getValidatorUrl()"
                        [validators]="getValidators()"/>
